services:
  redis:
    image: redis:7-alpine
    # Redis is internal-only: no host port, password required.
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    networks:
      - backend
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "82:82"
    networks:
      - backend
    depends_on:
      - backend

networks:
  backend:
    driver: bridge
