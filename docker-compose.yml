services:
  redis:
    image: redis:7-alpine
    # Redis is internal-only: no host port, password required.
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # Collects the hardware identifiers of the host for the license before the
  # backend starts and exits. It has no network and no extra privileges; the
  # backend itself only reads the resulting file.
  hwid:
    image: alpine:3.19
    network_mode: none
    restart: "no"
    environment:
      - MACHINE_ID_FILE=/host/machine-id
    volumes:
      - ./scripts/collect-hwid.sh:/collect-hwid.sh:ro
      - type: bind
        source: /etc/machine-id
        target: /host/machine-id
        read_only: true
        bind:
          create_host_path: false
      - /etc/pmdashboard:/etc/pmdashboard
    # A failure must not keep the application from starting: the license
    # screen reports a missing fingerprint, the reason is in the log of
    # this service (docker compose logs hwid).
    command: sh -c "sh /collect-hwid.sh || true"

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host port: the API is reachable only through the frontend nginx (port 82).
    expose:
      - "8080"
    volumes:
      - ./data:/data
      # Hardware identifiers of the host for the license, read-only;
      # the file in it is written by the hwid service.
      - /etc/pmdashboard:/etc/pmdashboard:ro
    networks:
      - backend
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # The time zone of the schedules (cleanup, full sync) and of the days
      # the history is kept by. Set TZ in .env to change it.
      - TZ=${TZ:-Europe/Moscow}
    depends_on:
      redis:
        condition: service_healthy
      hwid:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "82:82"
    networks:
      - backend
    depends_on:
      - backend

networks:
  backend:
    driver: bridge
