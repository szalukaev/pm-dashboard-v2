services:
  redis:
    image: redis:7-alpine
    # Redis доступен только внутри сети: порта на хосте нет, пароль обязателен.
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # Собирает аппаратные идентификаторы хоста для лицензии перед стартом
  # backend и завершается. У службы нет сети и лишних привилегий; сам backend
  # только читает получившийся файл.
  hwid:
    image: alpine:3.19
    network_mode: none
    restart: "no"
    environment:
      - MACHINE_ID_FILE=/host/machine-id
    volumes:
      - ./scripts/collect-hwid.sh:/collect-hwid.sh:ro
      - type: bind
        source: /etc/machine-id
        target: /host/machine-id
        read_only: true
        bind:
          create_host_path: false
      - /etc/pmdashboard:/etc/pmdashboard
    # Сбой не должен мешать запуску приложения: об отсутствии отпечатка
    # сообщает экран лицензии, причина — в журнале этой службы
    # (docker compose logs hwid).
    command: sh -c "sh /collect-hwid.sh || true"

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # После смены параметров базы на экране «Подключения» сервер завершается
    # сам, чтобы прочитать их заново, — Docker должен поднять его обратно.
    restart: unless-stopped
    # Порта на хосте нет: API доступен только через nginx службы frontend (порт 82).
    expose:
      - "8080"
    volumes:
      - ./data:/data
      # Аппаратные идентификаторы хоста для лицензии, только для чтения;
      # файл в каталоге пишет служба hwid.
      - /etc/pmdashboard:/etc/pmdashboard:ro
    networks:
      - backend
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # Часовой пояс расписаний (очистка, полная синхронизация) и дней, по
      # которым хранится история. Меняется переменной TZ в .env.
      - TZ=${TZ:-Asia/Yekaterinburg}
    depends_on:
      redis:
        condition: service_healthy
      hwid:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    # FRONTEND_BIND=127.0.0.1 — порт 82 только для обратного прокси на этом
    # же хосте (HTTPS); по умолчанию открыт наружу, как раньше
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:82:82"
    networks:
      - backend
    depends_on:
      - backend

networks:
  backend:
    driver: bridge
