# Клиентская поставка: готовые образы вместо сборки из исходников.
# build-release.sh кладёт этот файл в архив под именем docker-compose.yml и
# подставляет версию вместо __VERSION__. Остальное — как в docker-compose.yml.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis доступен только внутри сети: порта на хосте нет, пароль обязателен.
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # Собирает аппаратные идентификаторы хоста для лицензии перед стартом
  # backend и завершается. У службы нет сети и лишних привилегий.
  hwid:
    image: alpine:3.19
    network_mode: none
    restart: "no"
    environment:
      - MACHINE_ID_FILE=/host/machine-id
    volumes:
      - ./scripts/collect-hwid.sh:/collect-hwid.sh:ro
      - type: bind
        source: /etc/machine-id
        target: /host/machine-id
        read_only: true
        bind:
          create_host_path: false
      - /etc/pmdashboard:/etc/pmdashboard
    command: sh -c "sh /collect-hwid.sh || true"

  backend:
    image: pm-dashboard-backend:__VERSION__
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Порта на хосте нет: API доступен только через nginx службы frontend.
    expose:
      - "8080"
    volumes:
      - ./data:/data
      - /etc/pmdashboard:/etc/pmdashboard:ro
    networks:
      - backend
    environment:
      - APP_PORT=8080
      - DATA_DIR=/data
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - TZ=${TZ:-Asia/Yekaterinburg}
    depends_on:
      redis:
        condition: service_healthy
      hwid:
        condition: service_completed_successfully

  frontend:
    image: pm-dashboard-frontend:__VERSION__
    restart: unless-stopped
    # FRONTEND_BIND=127.0.0.1 — порт только для обратного прокси на этом же
    # хосте (HTTPS); FRONTEND_PORT — другой порт вместо 82
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-82}:82"
    networks:
      - backend
    depends_on:
      - backend

networks:
  backend:
    driver: bridge
