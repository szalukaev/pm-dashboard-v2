events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # rt — полное время запроса, urt — время ответа backend (секунды)
    log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log timed;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 82;
        server_name _;

        client_max_body_size 50M;

        # За внешним обратным прокси (HTTPS на хосте) запросы приходят из
        # внутренней сети Docker: настоящий адрес клиента берётся из его
        # X-Real-IP. Клиентам, подключившимся напрямую, заголовок не
        # доверяется — их адрес не из этих сетей.
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Real-IP;

        root /usr/share/nginx/html;
        index index.html;

        # Запросы к API — в backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # WebSocket — в backend
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
        }

        # Service worker и манифест веб-приложения браузер должен
        # перепроверять каждый раз: иначе установленное приложение
        # подхватит новую версию только через сутки
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location = /manifest.json {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Статические файлы с кэшированием
        location ~* \.(woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Файлы сборки: имя с хешем, содержимое не меняется. Отсутствующий
        # файл — честный 404, а не страница приложения: иначе браузер и
        # service worker сохраняли бы HTML под именем JS-файла, и вкладка
        # ломалась бы до сброса кэша
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Сама страница всегда перепроверяется: в ней ссылки на файлы
        # текущей сборки
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Остальные адреса отдают приложение (маршруты SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
